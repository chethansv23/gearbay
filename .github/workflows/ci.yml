name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Backend tests (unit + Testcontainers integration)
        run: npm ci && npx vitest run
      - name: Web UI tests and build
        run: cd web && npm ci && npm test && npm run build
      - name: Build service images
        run: docker compose build
